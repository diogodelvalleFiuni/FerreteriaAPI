# ============================================================================
# Todo configurable: cada valor puede sobreescribirse con la variable de entorno indicada.
# IMPORTANTE: este archivo debe llamarse application.properties. El JAR commons trae el suyo
# (con ddl-auto=validate, nombre "commons", etc.); al existir este en el proyecto, el del JAR
# queda tapado y NO se aplica.
# ============================================================================

spring.application.name=${APP_NAME:ms-ventas}
spring.config.import=optional:file:./local.properties
# ---- Servidor: solo escucha en localhost (puerto distinto al de ms-inventario) ----
server.address=${SERVER_ADDRESS:localhost}
server.port=${SERVER_PORT:8082}
# Contexto (prefijo) de toda la API REST. "/" = sin prefijo. Ej: CONTEXT_PATH=/ventas
server.servlet.context-path=${CONTEXT_PATH:/}

# ---- Base de datos compartida (Supabase = PostgreSQL) ----
# Conexion JDBC a Postgres (Supabase > Connect > "Session pooler" o "Direct connection"):
#   DB_HOST     db.<project-ref>.supabase.co          (directa, requiere IPv6)
#               aws-0-<region>.pooler.supabase.com    (pooler, funciona con IPv4)
#   DB_PORT     5432 (directa o session pooler)
#   DB_USER     postgres   (con el pooler: postgres.<project-ref>)
#   DB_PSWD     contrasena de la base de datos. Sin valor por defecto.
# Si usas el Transaction pooler (puerto 6543) agrega al final de la URL: &prepareThreshold=0
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PSWD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Supabase limita las conexiones simultaneas: pool chico
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:30000}

# ---- JPA: el esquema lo administra commons (Liquibase); aca Hibernate no lo toca ----
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# ---- Redis / Cache (instancia Redis COMPARTIDA con ms-inventario, ms-seguridad, ms-cache-redis) ----
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USER:}
spring.data.redis.password=${REDIS_PSWD:}
spring.data.redis.database=${REDIS_DB:0}
# Redis es OPCIONAL: si no responde, el servicio sigue con la base de datos. Timeouts cortos para no frenar las peticiones.
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT_MS:1000ms}
spring.data.redis.timeout=${REDIS_TIMEOUT_MS:1000ms}
# Tras un fallo, cuantos segundos no se vuelve a consultar Redis antes de reintentar
app.cache.retry-seconds=${CACHE_RETRY_SECONDS:30}
# Claves: <key-prefix><seccion>::<id>  (ej. ventas::clientes::15). El prefijo separa a este servicio de los demas.
app.cache.key-prefix=${CACHE_KEY_PREFIX:ventas::}
# Politica de retencion, en minutos. Un valor 0 (o negativo) = PERSISTENTE: no expira, solo se invalida al
# actualizar o borrar el objeto. Cualquier seccion sin valor propio usa default-ttl-minutes.
app.cache.default-ttl-minutes=${CACHE_TTL_DEFAULT_MIN:10}
# Con vida limitada (datos que cambian seguido: el saldo del cliente, borradores de presupuesto)
app.cache.ttl-minutes.clientes=${CACHE_TTL_CLIENTES_MIN:30}
app.cache.ttl-minutes.presupuestos=${CACHE_TTL_PRESUPUESTOS_MIN:10}
app.cache.ttl-minutes.presupuestos-detalle=${CACHE_TTL_PRESUPUESTOS_DETALLE_MIN:10}
# Persistentes (facturas emitidas: casi nunca cambian; cualquier cambio o borrado igual las invalida)
app.cache.ttl-minutes.facturas-ventas=${CACHE_TTL_FACTURAS_MIN:0}
app.cache.ttl-minutes.detalles-facturas-ventas=${CACHE_TTL_DETALLES_FACTURAS_MIN:0}

# ---- Seguridad JWT ----
# IMPORTANTE: la clave y el algoritmo deben ser EXACTAMENTE los mismos que usa ms-seguridad (quien emite el token);
# si difieren, toda firma se rechaza. Sin valor por defecto: la app no arranca sin JWT_SECRET.
#   JWT_SECRET         clave compartida. HS256 exige al menos 32 bytes.
#   JWT_SECRET_BASE64  true si la clave esta escrita en Base64 (se decodifica antes de usarla)
#   JWT_ALGORITHM      HS256 | HS384 | HS512
#   JWT_ISSUER         si se define, se exige que el claim "iss" coincida
#   JWT_ROLES_CLAIM    claim con los roles (lista o texto separado por espacios). Se mapean a ROLE_xxx
# NO hace falta JWT_REFRESH_SECRET aca: solo la conoce ms-seguridad.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.secret-base64=${JWT_SECRET_BASE64:false}
app.security.jwt.algorithm=${JWT_ALGORITHM:HS256}
app.security.jwt.issuer=${JWT_ISSUER:}
app.security.jwt.roles-claim=${JWT_ROLES_CLAIM:roles}

# ---- Autorizacion por roles (lista separada por comas; el usuario necesita UNO de los roles listados) ----
# Los nombres deben existir en la tabla roles de ms-seguridad. Se aplican por URL (SecurityConfig)
# y por metodo (@PreAuthorize en AbstractBaseController).
#   read    GET y POST .../search
#   write   POST (crear) y PUT (actualizar)
#   delete  DELETE
app.security.roles.read=${ROLES_READ:ADMIN,VENDEDOR}
app.security.roles.write=${ROLES_WRITE:ADMIN,VENDEDOR}
app.security.roles.delete=${ROLES_DELETE:ADMIN}

# ---- Borrado logico ----
# Presupuestos y facturas de venta se "borran" cambiando su estado al estado inactivo.
# Se identifica por id (ESTADO_INACTIVO_ID) o, si no se indica, por nombre en la tabla estados
# (ESTADO_INACTIVO_NOMBRE, sin distinguir mayusculas). Si ninguno existe, DELETE responde 500.
app.ventas.estado.inactivo-id=${ESTADO_INACTIVO_ID:}
app.ventas.estado.inactivo-nombre=${ESTADO_INACTIVO_NOMBRE:Inactivo}

# ---- Eureka (cliente): se registra al encender y renueva con heartbeats ----
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
# Este servicio escucha solo en localhost (server.address), por eso se registra como "localhost".
# Si lo expones a otras maquinas: SERVER_ADDRESS=0.0.0.0 y EUREKA_INSTANCE_HOSTNAME=<ip o host alcanzable>
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_HEARTBEAT_SECONDS:30}
eureka.instance.lease-expiration-duration-in-seconds=${EUREKA_EXPIRATION_SECONDS:90}

# ---- Paginacion ----
spring.data.web.pageable.default-page-size=${PAGE_DEFAULT_SIZE:20}
spring.data.web.pageable.max-page-size=${PAGE_MAX_SIZE:100}

# ---- Swagger / OpenAPI ----
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=${OPENAPI_DOCS_PATH:/v3/api-docs}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}
app.openapi.title=${OPENAPI_TITLE:API Ventas - Ferreteria}
app.openapi.description=${OPENAPI_DESCRIPTION:Microservicio de ventas: clientes, presupuestos y facturas de venta}
app.openapi.version=${OPENAPI_VERSION:1.0.0}

# ---- Logs a disco (los usa logback-spring.xml) ----
app.logging.dir=${LOG_DIR:logs}
app.logging.max-file-size=${LOG_MAX_FILE_SIZE:10MB}
app.logging.max-history=${LOG_MAX_HISTORY:30}
app.logging.total-size-cap=${LOG_TOTAL_SIZE_CAP:1GB}

# ---- Niveles de log ----
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.ferreteria.ventas=${LOG_LEVEL_APP:INFO}
# solicitudes entrantes
logging.level.com.ferreteria.ventas.controller=${LOG_LEVEL_CONTROLLER:INFO}
# pasos clave de negocio (DEBUG = detalle)
logging.level.com.ferreteria.ventas.service=${LOG_LEVEL_SERVICE:INFO}
# operaciones sobre la cache (GET/PUT/EVICT/CLEAR con HIT/MISS): se registran en INFO
logging.level.com.ferreteria.ventas.cache=${LOG_LEVEL_CACHE:INFO}
# seguridad (tokens rechazados, accesos denegados)
logging.level.com.ferreteria.ventas.security=${LOG_LEVEL_SECURITY:INFO}
# consultas del repositorio
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:DEBUG}
