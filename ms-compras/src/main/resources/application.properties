# ============================================================================
# Todo configurable: cada valor puede sobreescribirse con la variable de entorno indicada.
# IMPORTANTE: este archivo debe llamarse application.properties. El JAR commons trae el suyo
# (con ddl-auto=validate, nombre "commons", etc.); al existir este en el proyecto, el del JAR
# queda tapado y NO se aplica.
# ============================================================================

spring.application.name=${APP_NAME:ms-compras}
spring.config.import=optional:file:./local.properties
# ---- Servidor: solo escucha en localhost ----
server.address=${SERVER_ADDRESS:localhost}
server.port=${SERVER_PORT:8083}
# Contexto (prefijo) de toda la API REST. "/" = sin prefijo. Ej: CONTEXT_PATH=/compras
server.servlet.context-path=${CONTEXT_PATH:/}

# ---- Base de datos compartida (Supabase = PostgreSQL) ----
# OJO: aca va la conexion JDBC a Postgres, NO la URL https://xxx.supabase.co ni la anon/service key
# (esas son de la API REST). Se copian de Supabase > Connect > "Session pooler" o "Direct connection":
#   DB_HOST     db.<project-ref>.supabase.co          (directa, requiere IPv6)
#               aws-0-<region>.pooler.supabase.com    (pooler, funciona con IPv4)
#   DB_PORT     5432 (directa o session pooler)
#   DB_USER     postgres   (con el pooler: postgres.<project-ref>)
#   DB_PSWD     contrasena de la base de datos (Project Settings > Database). Sin valor por defecto.
# Si usas el Transaction pooler (puerto 6543) agrega al final de la URL: &prepareThreshold=0
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PSWD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Supabase limita las conexiones simultaneas: pool chico
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:30000}

# ---- JPA: el esquema lo administra commons (Liquibase); aca Hibernate no lo toca ----
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# ---- Eureka (cliente): se registra al encender y renueva con heartbeats ----
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
# Este servicio escucha solo en localhost (server.address), por eso se registra como "localhost".
# Si lo expones a otras maquinas: SERVER_ADDRESS=0.0.0.0 y EUREKA_INSTANCE_HOSTNAME=<ip o host alcanzable>
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_HEARTBEAT_SECONDS:30}
eureka.instance.lease-expiration-duration-in-seconds=${EUREKA_EXPIRATION_SECONDS:90}

# ---- Redis / Cache (MISMA instancia Redis que ms-inventario, ms-seguridad y ms-cache-redis) ----
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USER:}
spring.data.redis.password=${REDIS_PSWD:}
spring.data.redis.database=${REDIS_DB:0}
# Redis es OPCIONAL: si no responde, el servicio sigue con la base de datos. Timeouts cortos para no frenar las peticiones.
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT_MS:1000ms}
spring.data.redis.timeout=${REDIS_TIMEOUT_MS:1000ms}
# Tras un fallo, cuantos segundos no se vuelve a consultar Redis antes de reintentar
app.cache.retry-seconds=${CACHE_RETRY_SECONDS:30}
# TTL de las entradas (la seccion/nombre de cache es fijo por servicio, ver config/CacheNames y config/CacheConfig).
# Prefijo propio: las claves quedan "compras::<seccion>::<id>" y no se mezclan con las de Inventario.
app.cache.ttl-minutes=${CACHE_TTL_MINUTES:5}
app.cache.key-prefix=${CACHE_KEY_PREFIX:compras::}
# Nivel con el que se registran los get/put/evict de la cache (TRACE, DEBUG, INFO...)
app.cache.log-level=${CACHE_LOG_LEVEL:INFO}

# ---- Seguridad JWT ----
# MISMOS valores que ms-seguridad / ms-inventario (clave de ACCESS token; NO la de refresh).
#   JWT_SECRET         clave compartida. HS256 exige al menos 32 bytes. Sin valor por defecto.
#   JWT_SECRET_BASE64  true si la clave esta escrita en Base64
#   JWT_ALGORITHM      HS256 | HS384 | HS512
#   JWT_ISSUER         si se define, se exige que el claim "iss" coincida
#   JWT_ROLES_CLAIM    claim con los roles (lista o texto separado por espacios). Se mapean a ROLE_xxx
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.secret-base64=${JWT_SECRET_BASE64:false}
app.security.jwt.algorithm=${JWT_ALGORITHM:HS256}
app.security.jwt.issuer=${JWT_ISSUER:}
app.security.jwt.roles-claim=${JWT_ROLES_CLAIM:roles}

# ---- Paginacion ----
spring.data.web.pageable.default-page-size=${PAGE_DEFAULT_SIZE:20}
spring.data.web.pageable.max-page-size=${PAGE_MAX_SIZE:100}

# ---- Swagger / OpenAPI ----
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=${OPENAPI_DOCS_PATH:/v3/api-docs}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}
app.openapi.title=${OPENAPI_TITLE:API Compras - Ferreteria}
app.openapi.description=${OPENAPI_DESCRIPTION:Microservicio de compras: proveedores, facturas de compra y sus detalles}
app.openapi.version=${OPENAPI_VERSION:1.0.0}
# "/" = las pruebas del Swagger van al mismo host desde el que se abrio (directo o via API Gateway)
app.openapi.server-url=${OPENAPI_SERVER_URL:/}

# ---- Logs a disco (los usa logback-spring.xml) ----
app.logging.dir=${LOG_DIR:logs}
app.logging.max-file-size=${LOG_MAX_FILE_SIZE:10MB}
app.logging.max-history=${LOG_MAX_HISTORY:30}
app.logging.total-size-cap=${LOG_TOTAL_SIZE_CAP:1GB}

# ---- Niveles de log ----
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.ferreteria.compras=${LOG_LEVEL_APP:INFO}
# solicitudes entrantes
logging.level.com.ferreteria.compras.controller=${LOG_LEVEL_CONTROLLER:INFO}
# pasos clave de negocio (DEBUG = detalle)
logging.level.com.ferreteria.compras.service=${LOG_LEVEL_SERVICE:DEBUG}
# consultas del repositorio
# operaciones de cache (get/put/evict) y errores de Redis
logging.level.com.ferreteria.compras.config=${LOG_LEVEL_CACHE:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:DEBUG}

# ---- Reglas de negocio de compras ----
# Borrado logico: FacturaCompra no se borra, se le asigna el Estado cuyo nombre se indica aca
# (sin distinguir mayusculas). Si no existe en la tabla estados, se crea la primera vez que se necesita.
app.compras.estado.activo=${COMPRAS_ESTADO_ACTIVO:Activo}
app.compras.estado.inactivo=${COMPRAS_ESTADO_INACTIVO:Inactivo}
# IVA de los detalles. Porcentajes aceptados y el que se usa si el detalle no trae porcentaje.
app.compras.iva.porcentajes-validos=${COMPRAS_IVA_VALIDOS:0,5,10}
app.compras.iva.porcentaje-por-defecto=${COMPRAS_IVA_DEFECTO:10}
# true: el precio unitario ya incluye el IVA (convencion de facturacion en Paraguay: IVA = subtotal * p / (100 + p)).
# false: el IVA se suma sobre el precio (IVA = subtotal * p / 100).
app.compras.iva.incluido-en-precio=${COMPRAS_IVA_INCLUIDO:true}
# Decimales con los que se redondean montos de IVA y subtotales
app.compras.monto.escala=${COMPRAS_MONTO_ESCALA:2}
