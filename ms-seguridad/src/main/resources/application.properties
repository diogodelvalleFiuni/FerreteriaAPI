# Mismo esquema de variables de entorno que ms-inventario.
# Este archivo debe llamarse application.properties: tapa el application.properties que trae el JAR commons.

spring.application.name=${APP_NAME:ms-seguridad}
spring.config.import=optional:file:./local.properties

# ---- Servidor ----
server.address=${SERVER_ADDRESS:localhost}
server.port=${SERVER_PORT:8085}
server.servlet.context-path=${CONTEXT_PATH:/}

# ---- Base de datos compartida (Supabase = PostgreSQL), igual que ms-inventario ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PSWD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:30000}

# El esquema lo administra commons; Hibernate no lo toca
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false

# ---- JWT: MISMAS variables y valores que ms-inventario / api-gateway ----
#   JWT_SECRET, JWT_SECRET_BASE64, JWT_ALGORITHM, JWT_ISSUER, JWT_ROLES_CLAIM
# Solo ms-seguridad: JWT_EXPIRATION_MINUTES, JWT_REFRESH_SECRET, JWT_REFRESH_EXPIRATION_DAYS
# JWT_REFRESH_SECRET firma los refresh token: OBLIGATORIA, minimo 32 bytes y DISTINTA de JWT_SECRET
# (ms-inventario y ms-cache-redis NO la reciben; asi nunca aceptan un refresh token como access token).
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.secret-base64=${JWT_SECRET_BASE64:false}
app.security.jwt.algorithm=${JWT_ALGORITHM:HS256}
app.security.jwt.issuer=${JWT_ISSUER:}
app.security.jwt.roles-claim=${JWT_ROLES_CLAIM:roles}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.security.jwt.refresh-secret=${JWT_REFRESH_SECRET}
app.security.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# ---- Acceso: id_estado que permite iniciar sesion (tabla estados de commons) ----
app.security.access.active-estado-id=${ESTADO_ACTIVO_ID:1}

# ---- Freno a la fuerza bruta del login (por IP + usuario) ----
app.security.login-limit.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login-limit.lock-minutes=${LOGIN_LOCK_MINUTES:15}
# Detras del api-gateway la IP real llega en X-Forwarded-For: poner FORWARD_HEADERS_STRATEGY=framework SOLO si este
# puerto no es accesible directamente desde afuera (si no, cualquiera podria falsificar su IP).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# ---- Primer ADMIN (opcional): solo se crea si la tabla usuarios esta vacia. Quitar las variables despues. ----
app.security.bootstrap.admin-username=${BOOTSTRAP_ADMIN_USER:}
app.security.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}

# ---- Eureka (cliente), igual que ms-inventario ----
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_HEARTBEAT_SECONDS:30}
eureka.instance.lease-expiration-duration-in-seconds=${EUREKA_EXPIRATION_SECONDS:90}

# ---- Swagger deshabilitado (solo se necesitan las anotaciones para commons) ----
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

# ---- Logs ----
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.ferreteria.seguridad=${LOG_LEVEL_APP:INFO}
